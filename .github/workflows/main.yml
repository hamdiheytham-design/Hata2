name: Driver Pro - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Driver Pro project
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name "DriverPro_V3.6_Review_Fixes.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Driver Pro ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          set -e
          APP=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | grep '/app/' | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          set -e
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug
          else
            gradle -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Prepare APK
        run: |
          set -e
          mkdir -p output
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | grep "/debug/" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi
          cp "$APK" output/Driver-Pro.apk

      - name: Upload Driver Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-APK
          path: output/Driver-Pro.apk
          if-no-files-found: error
