name: Driver Pro - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Create Driver Pro APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and Extract ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Inspect Project Files
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find extracted -maxdepth 6 -type f | sort | head -n 200

          echo "===== GRADLE FILES ====="
          find extracted -type f \( \
            -name "gradlew" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "gradle-wrapper.properties" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \)

      - name: Locate Android Project
        run: |
          set -e

          GRADLE_FILE=$(find extracted -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) | grep '/app/' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$GRADLE_FILE")")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" \
              -p "$PROJECT_DIR" \
              assembleDebug \
              --stacktrace

          elif [ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Gradle wrapper script missing."
            exit 1

          else
            echo "Gradle wrapper not found."
            echo "Waiting for project inspection."
            exit 1
          fi

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Driver-Pro.apk

      - name: Upload Driver Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-APK
          path: output/Driver-Pro.apk
          if-no-files-found: error
          retention-days: 30
